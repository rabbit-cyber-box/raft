<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Рафт</title>
<style>
/* Layout: one column, catalogue-card detail view, sticky add button at the bottom of the shelf. */
:root{
  --bg:#f2f3ef; --surface:#fbfbf9; --ink:#18222b; --muted:#5b6872; --line:#d3d8d2;
  --accent:#27698a; --accent-ink:#ffffff; --accent-soft:#dcebf2;
  --ok:#2b7a4b; --ok-soft:#dcefe3; --warn:#9a5d12; --warn-soft:#f4e6cf; --bad:#b0352d; --bad-soft:#f6dedb;
  --serif:"Noto Serif","Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171c; --surface:#1a2128; --ink:#e7eaea; --muted:#95a2aa; --line:#2b353d;
    --accent:#6db4d4; --accent-ink:#0a1a23; --accent-soft:#1d3340;
    --ok:#6cc58d; --ok-soft:#1b3326; --warn:#e0a458; --warn-soft:#3a2d17; --bad:#ee8a82; --bad-soft:#3d1f1c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.top h1{font-size:28px;letter-spacing:.01em;flex:1}
.top .count{color:var(--muted);font-size:14px}
.back{border:0;background:none;padding:8px 10px 8px 0;color:var(--accent);font-weight:600;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%}

.tools{display:grid;gap:10px;margin:4px 0 14px}
.search{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sortrow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 8px}

.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cover{width:56px;height:80px;border-radius:3px 6px 6px 3px;overflow:hidden;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.spine{width:100%;height:100%;display:grid;place-items:center;color:#fff;font:600 26px var(--serif);border-left:6px solid rgba(0,0,0,.25)}
.meta{display:grid;gap:2px;min-width:0}
.meta .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.meta .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta .p{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-to_read{background:var(--accent-soft);color:var(--accent)}
.s-reading{background:var(--warn-soft);color:var(--warn)}
.s-read{background:var(--ok-soft);color:var(--ok)}

.empty{padding:28px 4px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .btn{max-width:720px;margin:0 auto;display:flex}

.note{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;margin:10px 0}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--ok-soft)}
.note button{margin-left:6px}

.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.slot{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.slot h3{font-size:15px}
.slot .shot{width:100px;height:140px;border-radius:4px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;overflow:hidden}
.slot .shot img{width:100%;height:100%;object-fit:cover}
.slot .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
label.field{display:grid;gap:6px;font-size:14px;color:var(--muted);margin:12px 0}
.cand{display:grid;gap:2px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cand.best{border-color:var(--accent)}
.cand .badge{justify-self:start;margin:0 0 4px}
.cand .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.cand .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.cand .p{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.slot .st{font-size:12px;color:var(--muted);text-align:center;min-height:1.2em;overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
label.field input{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.working{display:grid;gap:14px;justify-items:center;padding:48px 0;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-top-color:var(--line)}}

.head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:end;margin:6px 0 14px}
.head .cover{width:96px;height:136px}
.head .spine{font-size:40px}
.head h2{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.badge{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.b-high{background:var(--ok-soft);color:var(--ok)}
.b-medium{background:var(--warn-soft);color:var(--warn)}
.b-low{background:var(--bad-soft);color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin:12px 0}
.f{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--line)}
.f:last-child{border-bottom:0}
.f label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:0;background:transparent;padding:4px 0;color:var(--ink);font-family:var(--serif);font-size:16px;min-width:0}
.f textarea{resize:vertical;min-height:84px;font-family:var(--sans);font-size:15px;line-height:1.45}
.f textarea.ac{min-height:0;overflow:hidden;resize:none;font-family:var(--serif);font-size:16px;line-height:1.35;display:block}
.f.wide{grid-template-columns:1fr}
a{color:var(--accent)}
.f select{font-family:var(--sans)}
.srcs{display:grid;gap:6px;font-size:14px;margin:8px 0}
.srcs a{color:var(--accent);overflow-wrap:anywhere}
.diag{margin:10px 0;font-size:14px}
.diag summary{cursor:pointer}
.diag ul,.diagl{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.links .btn{flex:1 1 140px;text-decoration:none}
.vchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px;grid-column:1/-1}.vchips .chip{font-size:13px;text-align:left}
.acts2.tight{margin:10px 0}
.zoomable{cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:94vh;border-radius:4px}
.acts2{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.acts2 .btn{flex:1 1 140px}
h3.sec{font-size:16px;margin:22px 0 6px}
.small{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';

/* PURE:START — no DOM, no network; covered by tests */
const STATUS = { to_read: 'За четене', reading: 'Чета', read: 'Прочетена' };
/* The first 19 are the columns of the owner's spreadsheet, in its order; "Бележки" is the notes field. */
const FIELDS = [
  ['title', 'Заглавие'], ['author', 'Автор'], ['translator', 'Преводач'], ['isbn', 'ISBN'], ['publisher', 'Издателство'],
  ['genre', 'Жанр'], ['series', 'Поредица'], ['series_no', 'Номер в поредицата'], ['volume', 'Том'], ['binding', 'Подвързия'],
  ['pages', 'Брой страници'], ['chapters', 'Брой глави'], ['illustrator', 'Илюстратор'], ['language', 'Език'], ['country', 'Държава'],
  ['year', 'Година на издание'], ['size', 'Размер (мм)'], ['printer', 'Печат'], ['location', 'Местоположение на съхранение'],
  ['editor', 'Редактор'], ['cover_artist', 'Художник на корицата'], ['price_text', 'Цена']
];
const TABLE_N = 19;                                   // fields before the extras
const SUGGEST_LISTS = ['binding', 'country', 'language', 'size'];     // short values: a drop-down of what is already in the library
const CHIP_FIELDS = ['location', 'series', 'printer'];             // long values: tap a value already used
const COPY_FROM_PUBLISHER = ['series', 'binding', 'size', 'printer', 'location', 'language'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function isbn13Valid(d) {
  if (!/^\d{13}$/.test(d)) return false;
  let s = 0;
  for (let i = 0; i < 12; i++) s += (+d[i]) * (i % 2 ? 3 : 1);
  return (10 - (s % 10)) % 10 === +d[12];
}
function isbn10Valid(d) {
  if (!/^\d{9}[\dXx]$/.test(d)) return false;
  let s = 0;
  for (let i = 0; i < 10; i++) s += (i === 9 && /x/i.test(d[i]) ? 10 : +d[i]) * (10 - i);
  return s % 11 === 0;
}
function isbn10to13(d) {
  const b = '978' + d.slice(0, 9);
  let s = 0;
  for (let i = 0; i < 12; i++) s += (+b[i]) * (i % 2 ? 3 : 1);
  return b + ((10 - (s % 10)) % 10);
}
/* Returns a valid ISBN-13 (digits only) or ''. */
function normIsbn(raw) {
  const d = String(raw || '').replace(/[\s-]/g, '');
  if (isbn13Valid(d)) return d;
  if (isbn10Valid(d)) return isbn10to13(d);
  return '';
}
function parseJsonLoose(text) {
  const s = String(text || '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
}
function cleanStr(v) {
  if (v == null) return '';
  const s = String(v).trim();
  return /^(null|n\/a|unknown|няма|—|-)$/i.test(s) ? '' : s;
}
function cleanNum(v) {
  const n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10);
  return Number.isFinite(n) && n > 0 ? String(n) : '';
}
function safeUrl(u) {
  try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
function urlKey(u) {
  const s = safeUrl(u);
  return s ? s.replace(/#.*$/, '').replace(/\/+$/, '').toLowerCase() : '';
}
/* Collects text, search queries and every URL the API actually returned. */
function collect(blocks) {
  const texts = [], queries = [], urls = new Set();
  let final = [];                        // text after the last tool block = the answer itself
  for (const b of blocks || []) {
    if (b.type !== 'text') final = [];
    if (b.type === 'text') {
      texts.push(b.text || '');
      final.push(b.text || '');
      for (const c of b.citations || []) if (c.url) urls.add(urlKey(c.url));
    } else if (b.type === 'server_tool_use' && b.input && b.input.query) {
      queries.push(b.input.query);
    } else if (b.type === 'web_search_tool_result' && Array.isArray(b.content)) {
      for (const r of b.content) if (r.url) urls.add(urlKey(r.url));
    }
  }
  urls.delete('');
  return { texts, queries, urls, final: final.join('') };
}
/* Turns the model's JSON into a book. Sources and links that were never seen in the search are dropped. */
function bookFromModel(obj, seenUrls) {
  const o = obj || {};
  const isbnRaw = cleanStr(o.isbn);
  const isbn = normIsbn(isbnRaw) || isbnRaw;
  const sources = [];
  for (const s of Array.isArray(o.sources) ? o.sources : []) {
    const href = safeUrl(s && s.url);
    if (href && seenUrls.has(urlKey(href)) && !sources.some(x => x.url === href)) {
      sources.push({ title: cleanStr(s.title) || new URL(href).hostname, url: href });
    }
    if (sources.length >= 5) break;
  }
  const priceUrl = safeUrl(o.price_url);
  const conf = ['high', 'medium', 'low'].includes(o.confidence) ? o.confidence : 'low';
  return {
    title: cleanStr(o.title), author: cleanStr(o.author), translator: cleanStr(o.translator),
    editor: cleanStr(o.editor), cover_artist: cleanStr(o.cover_artist), publisher: cleanStr(o.publisher),
    year: cleanNum(o.year), pages: cleanNum(o.pages), isbn, language: cleanStr(o.language), genre: cleanStr(o.genre),
    price_text: cleanStr(o.price_text), price_url: priceUrl && seenUrls.has(urlKey(priceUrl)) ? priceUrl : '',
    description: cleanStr(o.description), sources, confidence: conf, note: cleanStr(o.note),
    isbn_ok: !isbn || isbn13Valid(isbn)
  };
}
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv(books) {
  const cols = FIELDS.map(f => f[0]).concat(['status', 'bought_at', 'notes', 'description', 'price_url', 'sources', 'added']);
  const head = FIELDS.map(f => f[1]).concat(['Статус', 'Къде е закупена', 'Бележки', 'Описание', 'Връзка към цената', 'Източници', 'Добавена']);
  const lines = [head.map(csvCell).join(';')];
  for (const b of books) {
    lines.push(cols.map(k => {
      if (k === 'status') return STATUS[b.status] || '';
      if (k === 'sources') return (b.sources || []).map(s => s.url).join(' ');
      if (k === 'added') return b.createdAt ? new Date(b.createdAt).toISOString().slice(0, 10) : '';
      return b[k];
    }).map(csvCell).join(';'));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}
/* ---- the spreadsheet: same columns for export and import ---- */
const TABLE_HEAD = FIELDS.slice(0, TABLE_N).map(f => f[1]).concat(['Бележки']);
const EXTRA_HEAD = ['Статус', 'Къде е закупена', 'Редактор', 'Художник на корицата', 'Цена', 'Описание'];
const HEAD_KEYS = (() => {
  const m = {}; for (const f of FIELDS) m[f[1].toLowerCase()] = f[0];
  m['бележки'] = 'notes'; m['къде е закупена'] = 'bought_at'; m['описание'] = 'description'; m['статус'] = 'status';
  m['страници'] = 'pages'; m['година'] = 'year'; m['художник на корицата'] = 'cover_artist';
  return m;
})();
function booksToRows(list) {
  const rows = [TABLE_HEAD.concat(EXTRA_HEAD)];
  for (const b of list) rows.push(FIELDS.slice(0, TABLE_N).map(f => String(b[f[0]] == null ? '' : b[f[0]])).concat([String(b.notes || '')],
    [STATUS[b.status] || '', b.bought_at || '', b.editor || '', b.cover_artist || '', b.price_text || '', b.description || ''].map(String)));
  return rows;
}
const keyTA = x => fold(String(x.title || '')).replace(/[^a-zа-я0-9]/g, '') + '|' + fold(String(x.author || '')).replace(/[^a-zа-я0-9]/g, '');
const keyT = x => fold(String(x.title || '')).replace(/[^a-zа-я0-9]/g, '');
/* Same ISBN is not enough: the owner's table has one ISBN on two different titles (a typo somewhere), and those must stay two books. */
const sameBook = (a, b) => {
  const ia = normIsbn(a.isbn), ib = normIsbn(b.isbn);
  if (ia && ib && ia === ib) return !keyT(a) || !keyT(b) || keyT(a) === keyT(b);
  if (ia && ib) return false;
  return !!a.title && keyTA(a) === keyTA(b);
};
/* Things worth a look in a table before importing it. */
function tableWarnings(list) {
  const seen = new Map(), dup = [], clash = [];
  for (const b of list) {
    const k = keyTA(b);
    if (b.title && seen.has(k)) dup.push(b.title); else seen.set(k, b);
  }
  const byIsbn = new Map();
  for (const b of list) { const i = normIsbn(b.isbn); if (!i) continue; const o = byIsbn.get(i); if (o && keyT(o) !== keyT(b)) clash.push(o.title + ' / ' + b.title); else if (!o) byIsbn.set(i, b); }
  return { dup: [...new Set(dup)], clash, badIsbn: list.filter(b => b.isbn && !normIsbn(b.isbn)).map(b => b.title) };
}
/* rows: array of arrays, first row = headers. Unknown columns are ignored. */
function rowsToBooks(rows, now) {
  if (!rows || rows.length < 2) return { books: [], skipped: 0, unknown: [], error: 'Таблицата е празна.' };
  const keys = rows[0].map(h => HEAD_KEYS[String(h || '').trim().toLowerCase()] || null);
  if (!keys.includes('title')) return { books: [], skipped: 0, unknown: [], error: 'Не намирам колона „Заглавие“. Това не прилича на таблицата на Рафт.' };
  const unknown = rows[0].filter((h, i) => h && !keys[i]).map(String);
  const stByLabel = Object.fromEntries(Object.entries(STATUS).map(([k, l]) => [l.toLowerCase(), k]));
  const books = []; let skipped = 0, n = 0;
  for (const r of rows.slice(1)) {
    const o = blankBook(); let any = false;
    keys.forEach((k, i) => {
      if (!k) return;
      let v = r[i]; if (v == null) return;
      v = String(typeof v === 'number' ? (Number.isInteger(v) ? v.toFixed(0) : v) : v).replace(/\s+/g, ' ').trim();
      if (!v) return; any = true;
      if (k === 'status') { o.status = stByLabel[v.toLowerCase()] || 'to_read'; return; }
      if (k === 'isbn') { const d = normIsbn(v); o.isbn = d || v.replace(/[^0-9Xx-]/g, ''); o.isbn_ok = !!d; return; }
      o[k] = v;
    });
    if (!any || !(o.title || o.author || o.isbn)) { skipped++; continue; }
    Object.assign(o, { id: 'imp' + (now || Date.now()).toString(36) + (n++).toString(36), createdAt: (now || Date.now()) + n, updatedAt: (now || Date.now()) + n, origin: 'manual', note: '' });
    o.status = o.status || 'to_read'; o.notes = o.notes || ''; o.bought_at = o.bought_at || '';
    books.push(o);
  }
  return { books, skipped, unknown, error: '' };
}

function apiErr(status, data) {

  if (status === 403) return 'Ключът няма достъп до този модел или функция. ' + m;
  if (status === 404) return 'Моделът не е намерен. Провери името му в Настройки.';

  if (status >= 500) return 'Услугата е претоварена или временно недостъпна. Опитай пак.';

      catFetch('Open Library', step, 'https://openlibrary.org/search.json?q=' + enc + '&limit=10&fields=' + OL_FIELDS, signal, olDocCount).then(r => { rep.push(r); return r; })
    ]);

async function withProgress(title, hint, fn) {

    '<p class="small" id="el">' + esc(hint) + '</p><button class="btn" id="bStop">Спри</button></div>';
  app.querySelector('#bStop').onclick = () => abortCtl.abort();
  const tick = setInterval(() => { const e = document.getElementById('el'); if (e) e.textContent = Math.round((Date.now() - t0) / 1000) + ' с. ' + hint; }, 1000);
  let lock = null;
  try { lock = await (navigator.wakeLock && navigator.wakeLock.request('screen')); } catch (e) { /* optional */ }
  try {
    return { ok: true, value: await fn(abortCtl.signal) };
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok: false, aborted: true };
    return { ok: false, error: e instanceof TypeError ? 'Няма връзка с интернет, или браузърът блокира заявката.' : e.message };

    ws['!cols'] = booksToRows([])[0].map((h, i) => ({ wch: [30, 24, 20, 15, 22, 20, 22, 10, 6, 14, 8, 8, 16, 11, 14, 8, 12, 18, 30, 40, 14, 20, 14, 14, 30][i] || 14 }));

    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Библиотека');
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await saveFile('biblioteka-' + stamp() + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', new Blob([out]));
    toast('Таблицата е готова: ' + books.length + ' книги.');
  } catch (e) { toast('Таблицата не се запази.'); }
}
function exportCsv() { saveFile('raft-' + stamp() + '.csv', 'text/csv;charset=utf-8', toCsv(books)).catch(() => toast('Файлът не се запази.')); }
function statsHtml() {
  const st = libraryStats(books);
  if (!st.total) return '';
  const row = (l, v) => '<div class="f"><label>' + esc(l) + '</label><div>' + esc(v) + '</div></div>';
  return '<h3 class="sec">Библиотеката в числа</h3><div class="card">' +
    row('Книги', st.total) + Object.entries(STATUS).map(([k, l]) => row(l, st.byStatus[k] || 0)).join('') +
    row('С ISBN', st.withIsbn + ' от ' + st.total) + row('Със снимка на корица', st.withCover + ' от ' + st.total) +
    (st.authors.length ? row('Най-често срещани автори', st.authors.map(e => e[0] + ' (' + e[1] + ')').join(', ')) : '') +
    (st.publishers.length ? row('Най-често срещани издателства', st.publishers.map(e => e[0] + ' (' + e[1] + ')').join(', ')) : '') +
    (st.decades.length ? row('По десетилетия', st.decades.map(e => e[0] + 'те: ' + e[1]).join(', ')) : '') + '</div>';
}
function archiveHtml() {
  const bm = getBackupMeta(), age = bm ? daysSince(bm.t) : null;
  const photos = books.filter(b => b.thumb || b.cover).length;
  return '<p class="small">Пълният архив е един файл с всички книги, бележки и снимки на кориците. Запазвай го на място извън телефона (Google Drive, имейл, компютър). Възстановяването само добавя и обновява книги, никога не изтрива.</p>' +
    '<p class="small" id="bkInfo">Книги: ' + books.length + ', със снимки: ' + photos + '. ' + (bm && age != null ? 'Последен архив: ' + bm.t.slice(0, 10) + (age ? ' (преди ' + age + ' дни).' : ' (днес).') : 'Още няма архив.') + '</p>' +
    '<div class="acts2"><button class="btn primary" id="bArchive">Запази пълен архив</button>' +
    '<label class="btn">Възстанови от архив<input class="vh" id="impA" type="file" accept="application/json,.json"></label></div>' +
    '<div id="restoreOut"></div><p class="small" id="storInfo"></p>';
}
function renderSettings() {
  const s = getSettings();
  app.innerHTML = '<div class="top"><button class="back" id="bBack">‹ Назад</button><h1>Настройки</h1></div>' +
    statsHtml() +
    '<h3 class="sec">Архив и възстановяване</h3>' + archiveHtml() +
    '<h3 class="sec">Безплатно разпознаване</h3>' +
    '<label class="chk" for="ocr"><input id="ocr" type="checkbox"' + (s.ocr ? ' checked' : '') + '><span>Разпознавай текст от снимките на телефона (OCR). Безплатно, около 5 до 20 секунди на снимка. Снимките не напускат телефона.</span></label>' +
    '<label class="field" for="gkey">Google Books API ключ (по избор)<input id="gkey" type="password" value="' + esc(s.googleKey) + '" autocomplete="off" spellcheck="false"></label>' +
    '<h3 class="sec">Проверка на каталозите</h3>' +
    '<p class="small">Показва какво отговарят Google Books и Open Library: книгата не е намерена, или заявката е пропаднала (квота, блокиране, няма връзка). Контролният ISBN е известна книга, за да се види дали самите услуги работят.</p>' +
    '<label class="field" for="dg">ISBN за проба<input id="dg" inputmode="numeric" value="' + esc(lastIsbn || draft.isbn || '') + '" autocomplete="off"></label>' +
    '<button class="btn block" id="bDiag">Провери каталозите</button><div id="diagOut"></div>' +
    '<h3 class="sec">Claude API (по избор)</h3>' +
    '<p class="small">Нужен е само за книги, които не се намират безплатно. Ключът се пази само в този браузър на телефона и се изпраща само към api.anthropic.com. Създава се на console.anthropic.com. Препоръчително е да зададеш месечен лимит на разходите там.</p>' +
    '<label class="field" for="key">API ключ<input id="key" type="password" value="' + esc(s.key) + '" autocomplete="off" spellcheck="false"></label>' +
    '<label class="field" for="model">Модел<input id="model" value="' + esc(s.model) + '" autocomplete="off" spellcheck="false"></label>' +
    '<label class="field" for="max">Най-много търсения в интернет на книга (1 до 10)<input id="max" type="number" min="1" max="10" value="' + esc(s.maxSearches) + '"></label>' +
    '<div class="acts2"><button class="btn primary" id="bSave">Запази</button><button class="btn" id="bTest">Тествай ключа</button></div><div id="testOut"></div>' +
    '<h3 class="sec">Таблица (Excel)</h3><p class="small">Същите колони като в твоята таблица. Импортът само добавя нови книги и попълва празни полета, нищо не презаписва и не изтрива. Книги се познават по ISBN, а без ISBN по заглавие и автор.</p>' +
    '<div class="acts2"><button class="btn primary" id="bXlsx">Експорт в Excel</button><label class="btn">Импорт от таблица<input class="vh" id="impT" type="file" accept=".xlsx,.xls,.csv,text/csv"></label></div><div id="impOut"></div>' +
    '<div class="acts2"><button class="btn" id="bCsv">Експорт в CSV</button></div>';
  const $ = x => app.querySelector(x);
  const read = () => {
    const max = Math.min(10, Math.max(1, parseInt($('#max').value, 10) || 6));
    return { key: $('#key').value.trim(), model: $('#model').value.trim() || DEFAULTS.model, maxSearches: max, ocr: $('#ocr').checked, googleKey: $('#gkey').value.trim() };
  };
  $('#bBack').onclick = back;
  $('#bSave').onclick = () => toast(saveSettings(read()) ? 'Запазено.' : 'Браузърът не позволява запис.');
  $('#bTest').onclick = async () => {
    const out = $('#testOut'); const v = read();
    if (!v.key) { out.innerHTML = '<div class="note warn">Въведи ключ.</div>'; return; }
    out.innerHTML = '<div class="note">Проверявам…</div>';
    try {
      const r = await callApi(v, { model: v.model, max_tokens: 16, messages: [{ role: 'user', content: 'Reply with: ok' }] });
      out.innerHTML = r.ok ? '<div class="note ok">Ключът работи.</div>' : '<div class="note bad">' + esc(apiErr(r.status, r.data)) + '</div>';
    } catch (e) { out.innerHTML = '<div class="note bad">Няма връзка, или браузърът блокира заявката.</div>'; }
  };
  $('#bDiag').onclick = async () => {
    const out = $('#diagOut'), btn = $('#bDiag');
    const mine = normIsbn($('#dg').value.trim()), CONTROL = '9780140328721';
    if ($('#dg').value.trim() && !mine) { out.innerHTML = '<div class="note bad">Този ISBN не минава проверката на контролната цифра.</div>'; return; }
    btn.disabled = true; out.innerHTML = '<div class="note">Проверявам…</div>';
    const ctl = new AbortController();
    const run = async isbn => {
      const rep = []; let found = null, err = '';
      try { found = await freeLookup(isbn, ctl.signal, rep); } catch (e) { err = 'Прекъснато.'; }
      const sm = summarize(rep);
      const head = err || sm.kind === 'error' ? 'bad' : sm.kind === 'partial' ? 'warn' : found ? 'ok' : 'warn';
      const txt = err || (sm.kind === 'error' ? 'Услугите не отговориха.' : (found ? 'Намерена: ' + found.title : 'Не е намерена') + (sm.kind === 'partial' ? ' (поне една заявка не успя)' : ''));
      return '<div class="note ' + head + '"><b>ISBN ' + esc(isbn) + ':</b> ' + esc(txt) + '<ul class="diagl">' + sm.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>';
    };
    out.innerHTML = (mine ? await run(mine) : '') + '<div class="small">Контрола:</div>' + await run(CONTROL);
    btn.disabled = false;
  };
  $('#bCsv').onclick = exportCsv;
  $('#bXlsx').onclick = exportXlsx;
  $('#impT').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const out = $('#impOut'); out.innerHTML = '<p class="small">Чета таблицата…</p>';
    try {
      await loadXlsx();
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      const pr = rowsToBooks(rows);
      if (pr.error) { out.innerHTML = '<div class="note bad">' + esc(pr.error) + '</div>'; return; }
      const plan = planImport(await dbAll(), pr.books), tw = tableWarnings(pr.books);
      out.innerHTML = '<div class="note"><b>' + esc(f.name) + ':</b> ' + pr.books.length + ' книги.<ul class="diagl">' +
        '<li>Нови: ' + plan.add.length + '</li><li>Вече в Рафта, ще се попълнят празни полета: ' + plan.fill.length + '</li><li>Вече в Рафта, без промяна: ' + plan.same + '</li>' +
        (tw.dup.length ? '<li>Повтарящи се книги в таблицата (същото заглавие и автор): ' + tw.dup.length + '. Ще се внесат и двете; прегледай ги после.</li>' : '') +
        (tw.clash.length ? '<li>Един ISBN на различни заглавия: ' + esc(tw.clash.join('; ')) + '. Вероятно е грешка в таблицата; внасят се като отделни книги.</li>' : '') +
        (tw.badIsbn.length ? '<li>ISBN с грешна контролна цифра: ' + tw.badIsbn.length + '. Белязани са като непроверени.</li>' : '') +
        (pr.skipped ? '<li>Празни редове, пропуснати: ' + pr.skipped + '</li>' : '') + (pr.unknown.length ? '<li>Непознати колони, пропуснати: ' + esc(pr.unknown.join(', ')) + '</li>' : '') +
        '<li>Статусът на новите книги е „За четене“, ако в таблицата няма колона „Статус“.</li></ul></div>' +
        '<div class="acts2"><button class="btn primary" id="bDoImp"' + (plan.add.length + plan.fill.length ? '' : ' disabled') + '>Импортирай</button><button class="btn" id="bNoImp">Отказ</button></div>';
      $('#bNoImp').onclick = () => { out.innerHTML = ''; };
      $('#bDoImp').onclick = async () => {
        try {
          for (const b of plan.add) await dbPut(b);
          const cur0 = await dbAll();
          for (const x of plan.fill) { const old = cur0.find(b => b.id === x.id); if (old) await dbPut(Object.assign({}, old, x.patch, { updatedAt: Date.now() })); }
          books = await dbAll(); out.innerHTML = '<div class="note ok">Готово: добавени ' + plan.add.length + ', допълнени ' + plan.fill.length + '. Направи архив, за да е запазено.</div>';
        } catch (err) { out.innerHTML = '<div class="note bad">Импортът не завърши. Провери дали има свободно място и опитай пак.</div>'; }
      };
    } catch (err) { out.innerHTML = '<div class="note bad">Таблицата не може да се прочете.</div>'; }
  };
  $('#bArchive').onclick = async () => {
    try {
      const text = await makeArchive(), n = JSON.parse(text).count;
      await saveFile('raft-arhiv-' + stamp() + '.json', 'application/json', text);
      setBackupMeta(n); toast('Архивът е готов: ' + n + ' книги.');
      const i = $('#bkInfo'); if (i) i.textContent = 'Последен архив: днес, ' + n + ' книги.';
    } catch (e) { toast('Архивът не се запази.'); }
  };
  $('#impA').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const out = $('#restoreOut');
    try {
      const text = await f.text(), pa = parseArchive(text);
      if (!pa.ok) { out.innerHTML = '<div class="note bad">' + esc(pa.error) + '</div>'; return; }
      if (pa.sha) { const got = await sha256hex(JSON.stringify(pa.rawBooks)); if (got && got !== pa.sha) { out.innerHTML = '<div class="note bad">Архивът е повреден: контролната сума не съвпада. Не го възстановявам.</div>'; return; } }
      const plan = planRestore(await dbAll(), pa.books);
      out.innerHTML = '<div class="note"><b>Архив' + (pa.exportedAt ? ' от ' + esc(pa.exportedAt.slice(0, 10)) : '') + ':</b> ' + pa.books.length + ' книги.<ul class="diagl">' +
        '<li>Нови: ' + plan.add.length + '</li><li>По-нови от тези при теб (ще се обновят): ' + plan.update.length + '</li>' +
        '<li>Вече същите: ' + plan.same + '</li><li>При теб са по-нови или без дата (остават): ' + plan.keepLocal + '</li>' +
        (pa.invalid ? '<li>Невалидни записи, пропуснати: ' + pa.invalid + '</li>' : '') + (pa.countMismatch ? '<li>Броят в архива не съвпада с книгите в него.</li>' : '') + '</ul></div>' +
        '<div class="acts2"><button class="btn primary" id="bDoRestore"' + (plan.add.length + plan.update.length ? '' : ' disabled') + '>Възстанови</button><button class="btn" id="bNoRestore">Отказ</button></div>';
      $('#bNoRestore').onclick = () => { out.innerHTML = ''; };
      $('#bDoRestore').onclick = async () => {
        try {
          for (const b of plan.add.concat(plan.update)) await dbPut(b);
          books = await dbAll(); out.innerHTML = '<div class="note ok">Готово: добавени ' + plan.add.length + ', обновени ' + plan.update.length + '.</div>';
        } catch (err) { out.innerHTML = '<div class="note bad">Възстановяването не завърши. Провери дали има свободно място и опитай пак.</div>'; }
      };
    } catch (err) { out.innerHTML = '<div class="note bad">Файлът не може да се прочете.</div>'; }
  };
  (async () => {
    try {
      const per = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      const el = $('#storInfo'); if (!el) return;
      el.textContent = 'Хранилище: ' + (per === true ? 'защитено от автоматично изчистване' : per === false ? 'не е защитено от автоматично изчистване, затова правилният архив е важен' : 'състоянието е неизвестно') +
        (est && est.usage != null ? '. Използвано: ' + (est.usage / 1048576).toFixed(1) + ' MB.' : '.');
    } catch (e) { /* informational */ }
  })();
}

/* ---------- start ---------- */
(async function init() {
  history.replaceState({ v: 'library' }, '');
  try { books = await dbAll(); } catch (e) { toast('Хранилището не е достъпно в този режим на браузъра.'); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* best effort */ }
  renderLibrary();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
